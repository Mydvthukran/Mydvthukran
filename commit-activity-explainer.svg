<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">How to read the GitHub commit-time graph</title>
  <desc id="desc">An annotated example of a 24-hour commit histogram. Labels explain the vertical commit-count axis, horizontal hour axis in India Standard Time, individual hourly bars, and the tallest bar as the busiest commit hour. A note explains that commits are not coding hours.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b2b"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/>
    </marker>
    <style>
      .main { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .muted { fill: #9aa8c1; }
      .white { fill: #f8fafc; }
      .cyan { fill: #67e8f9; }
      .small { font-size: 15px; }
      .label { font-size: 17px; font-weight: 700; }
      .call { fill: none; stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrow); }
      .gridline { stroke: #36445f; stroke-width: 1; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect x="8" y="8" width="1084" height="634" rx="24" fill="url(#bg)" stroke="#303b55" stroke-width="2"/>
  <g class="main">
    <text x="54" y="66" class="white" font-size="29" font-weight="800">HOW TO READ YOUR COMMIT-TIME GRAPH</text>
    <text x="55" y="96" class="muted" font-size="16">A 24-hour view of when GitHub commits were recorded · India Standard Time (IST)</text>
    <rect x="850" y="43" width="190" height="34" rx="17" fill="#312e81" stroke="#6366f1"/>
    <text x="945" y="65" text-anchor="middle" fill="#c7d2fe" font-size="13" font-weight="700">VISUAL GUIDE</text>

    <!-- Plot -->
    <rect x="115" y="132" width="865" height="285" rx="14" fill="#0c1322" stroke="#2b3851"/>
    <g>
      <line x1="160" y1="175" x2="940" y2="175" class="gridline"/>
      <line x1="160" y1="225" x2="940" y2="225" class="gridline"/>
      <line x1="160" y1="275" x2="940" y2="275" class="gridline"/>
      <line x1="160" y1="325" x2="940" y2="325" class="gridline"/>
      <line x1="160" y1="375" x2="940" y2="375" stroke="#8190aa" stroke-width="1.5"/>
      <text x="145" y="180" text-anchor="end" class="muted small">100</text>
      <text x="145" y="230" text-anchor="end" class="muted small">75</text>
      <text x="145" y="280" text-anchor="end" class="muted small">50</text>
      <text x="145" y="330" text-anchor="end" class="muted small">25</text>
      <text x="145" y="380" text-anchor="end" class="muted small">0</text>
      <text x="160" y="402" class="muted small">00:00</text>
      <text x="350" y="402" text-anchor="middle" class="muted small">06:00</text>
      <text x="550" y="402" text-anchor="middle" class="muted small">12:00</text>
      <text x="750" y="402" text-anchor="middle" class="muted small">18:00</text>
      <text x="940" y="402" text-anchor="end" class="muted small">23:00</text>
    </g>
    <!-- Illustrative hourly bars -->
    <g>
      <rect x="174" y="302" width="20" height="73" rx="3" fill="url(#bars)"/>
      <rect x="206" y="315" width="20" height="60" rx="3" fill="url(#bars)"/>
      <rect x="238" y="329" width="20" height="46" rx="3" fill="url(#bars)"/>
      <rect x="270" y="329" width="20" height="46" rx="3" fill="url(#bars)"/>
      <rect x="302" y="363" width="20" height="12" rx="3" fill="url(#bars)"/>
      <rect x="334" y="365" width="20" height="10" rx="3" fill="url(#bars)"/>
      <rect x="366" y="369" width="20" height="6" rx="3" fill="url(#bars)"/>
      <rect x="398" y="367" width="20" height="8" rx="3" fill="url(#bars)"/>
      <rect x="430" y="371" width="20" height="4" rx="3" fill="url(#bars)"/>
      <rect x="462" y="369" width="20" height="6" rx="3" fill="url(#bars)"/>
      <rect x="494" y="341" width="20" height="34" rx="3" fill="url(#bars)"/>
      <rect x="526" y="351" width="20" height="24" rx="3" fill="url(#bars)"/>
      <rect x="558" y="355" width="20" height="20" rx="3" fill="url(#bars)"/>
      <rect x="590" y="345" width="20" height="30" rx="3" fill="url(#bars)"/>
      <rect x="622" y="282" width="20" height="93" rx="3" fill="url(#bars)"/>
      <rect x="654" y="271" width="20" height="104" rx="3" fill="url(#bars)"/>
      <rect x="686" y="279" width="20" height="96" rx="3" fill="url(#bars)"/>
      <rect x="718" y="319" width="20" height="56" rx="3" fill="url(#bars)"/>
      <rect x="750" y="319" width="20" height="56" rx="3" fill="url(#bars)"/>
      <rect x="782" y="319" width="20" height="56" rx="3" fill="url(#bars)"/>
      <rect x="814" y="265" width="20" height="110" rx="3" fill="url(#bars)"/>
      <rect x="846" y="164" width="20" height="211" rx="3" fill="url(#peak)" stroke="#f0abfc" stroke-width="1"/>
      <rect x="878" y="245" width="20" height="130" rx="3" fill="url(#bars)"/>
      <rect x="910" y="300" width="20" height="75" rx="3" fill="url(#bars)"/>
    </g>

    <!-- Axis explanations -->
    <text x="70" y="275" transform="rotate(-90 70 275)" class="cyan label" text-anchor="middle">COMMIT COUNT</text>
    <text x="550" y="445" text-anchor="middle" class="cyan label">HOUR OF DAY (IST) →</text>

    <!-- Callouts -->
    <rect x="28" y="145" width="122" height="54" rx="10" fill="#172b42" stroke="#38bdf8"/>
    <text x="89" y="167" text-anchor="middle" fill="#bae6fd" font-size="13" font-weight="700">Y-AXIS</text>
    <text x="89" y="185" text-anchor="middle" fill="#e0f2fe" font-size="12">how many</text>
    <path d="M150 174 L160 174" class="call"/>

    <rect x="28" y="450" width="228" height="67" rx="11" fill="#172b42" stroke="#38bdf8"/>
    <text x="46" y="475" fill="#bae6fd" font-size="14" font-weight="700">X-AXIS · 00 TO 23</text>
    <text x="46" y="497" fill="#e0f2fe" font-size="13">Each position is one hour</text>
    <path d="M256 470 L330 403" class="call"/>

    <rect x="325" y="475" width="300" height="66" rx="11" fill="#241a3a" stroke="#a78bfa"/>
    <rect x="345" y="493" width="16" height="24" rx="3" fill="url(#bars)"/>
    <text x="375" y="502" fill="#ddd6fe" font-size="14" font-weight="700">ONE BAR = ONE HOUR</text>
    <text x="375" y="522" fill="#e9d5ff" font-size="13">Taller bar means more commits</text>
    <path d="M500 475 L665 275" class="call"/>

    <rect x="710" y="475" width="350" height="66" rx="11" fill="#321b3e" stroke="#e879f9"/>
    <text x="730" y="502" fill="#f5d0fe" font-size="14" font-weight="700">TALLEST BAR = PEAK COMMIT HOUR</text>
    <text x="730" y="522" fill="#fae8ff" font-size="13">The hour with the most recorded commits</text>
    <path d="M850 475 L855 379" stroke="#e879f9" stroke-width="2.5" fill="none"/>

    <rect x="28" y="562" width="1032" height="52" rx="12" fill="#1b2937" stroke="#2dd4bf"/>
    <circle cx="56" cy="588" r="10" fill="#2dd4bf"/>
    <text x="56" y="593" text-anchor="middle" fill="#082f2e" font-size="13" font-weight="800">i</text>
    <text x="80" y="593" fill="#ccfbf1" font-size="15" font-weight="700">IMPORTANT:</text>
    <text x="175" y="593" fill="#e2e8f0" font-size="15">This chart counts commits—not hours spent coding. The bars above are an illustrative guide, not live counts.</text>
  </g>
</svg>